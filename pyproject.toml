[project]
name = "complaint-radar"
version = "0.1.0"
description = "Early-warning system for CFPB consumer-finance complaints on Databricks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "duckdb>=1.1",
    "pyyaml>=6",
    "sqlglot>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["setup"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
